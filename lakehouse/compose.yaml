# Postgres for the lakehouse's JDBC read, under its own compose project name and its own port so it never meets the hub's database on 5433.
#   docker compose -p lakehouse-pg -f lakehouse/compose.yaml up -d --wait
#   docker compose -p lakehouse-pg -f lakehouse/compose.yaml down -v
# The image is the one the hub's own compose file uses (the migrations include pgvector).
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "127.0.0.1:5543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
