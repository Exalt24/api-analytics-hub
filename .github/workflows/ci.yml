name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # The same database the compose file starts, on the port the tests default to, so the row level security, control plane and
    # observability suites run here instead of skipping.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: analytics
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Stripe's own mock server, for the tests that run the official stripe SDK against it (tests/test_billing_stripe_sdk.py, test_billing_stripe_sdk_db.py).
      # It checks each request against Stripe's OpenAPI spec and keeps no state; it is not Stripe.
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
      # The backing services of the job pipeline (docs/job-pipeline.md), on the ports tests/jobs_fixtures.py defaults to. SeaweedFS is started by a step below
      # because it needs a config file mounted.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.18.0
        ports:
          - 6343:6333
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5683:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # A service container has no health check here (the image holds only the server), so wait until it answers before any test collects.
      - name: Wait for stripe-mock
        run: |
          curl --silent --output /dev/null --fail --retry 15 --retry-connrefused --retry-delay 1 -H "Authorization: Bearer sk_test_123" http://127.0.0.1:12111/v1/payment_intents/pi_1
      # Chromium for the price watch scraper tests (tests/test_price_watch_scraper.py, test_price_watch_loop.py). Without it those tests skip.
      - run: python -m playwright install --with-deps chromium
      # SeaweedFS as the S3 compatible store for the job pipeline's raw JSON archive: one made-up identity in web/tests/s3/seaweedfs-s3.json, not AWS and not R2.
      - name: Start the S3 stand-in
        run: |
          docker run -d --name jobs-s3 -p 8333:8333 -v "$PWD/web/tests/s3/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs:4.53 server -dir=/data -master.volumeSizeLimitMB=64 -volume.max=0 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
          for i in $(seq 1 40); do code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true); [ "$code" = "403" ] && break; sleep 1; done
          echo "S3 stand-in answered $code"
      # The gateway answers 403 before the store can place an object (the first writes returned InternalError and failed four archive tests), so wait for a real write.
      - name: Wait until the S3 stand-in accepts a write
        run: python tests/s3_warmup.py
      - run: python -m pytest tests -q
      # When the suite fails, print what the S3 stand-in logged and how much disk the runner has: an S3 InternalError is otherwise a bare "please try again".
      - name: S3 stand-in diagnostics (only after a failure)
        if: failure()
        run: |
          docker logs jobs-s3 --tail 60 || true
          df -h /
      # The same tests again, named, with PRICE_WATCH_REQUIRE_BROWSER set so a missing Chromium FAILS here instead of skipping, and the skip reasons printed.
      - name: Price watch (scraper, matching, report, queue, sync against fake vendors)
        env:
          PRICE_WATCH_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/test_price_watch_scraper.py tests/test_price_watch_matching.py tests/test_price_watch_report.py tests/test_price_watch_adapters.py tests/test_price_watch_db.py tests/test_price_watch_sync_db.py tests/test_price_watch_loop.py -q -rs
      # The job pipeline (dedupe window, ingest, tailoring, form filler, review queue, API, n8n JavaScript), named so a missing service FAILS here instead of skipping:
      # JOBS_REQUIRE_SERVICES makes tests/jobs_fixtures.py raise at collection when Postgres, Redis, Qdrant, RabbitMQ or S3 is not reachable.
      - name: Job pipeline (against Redis, Qdrant, RabbitMQ, Postgres and an S3 stand-in)
        env:
          JOBS_REQUIRE_SERVICES: "1"
        run: |
          (cd n8n/jobs && npm install --no-audit --no-fund)
          node --test n8n/jobs/normalize.test.js
          python -m pytest tests/test_jobs_*.py -q -rs
      # The billing module (signature, proration, provider client, ledger, wallet, payments, webhook receiver, reports, the seeded simulation and the command line), named so a skipped
      # database suite shows in the log. BILLING_REQUIRE_DB makes an unreachable Postgres FAIL here instead of skipping, and -rs prints any skip reason.
      # STRIPE_MOCK_REQUIRE makes a stripe-mock that did not start FAIL the collection of the SDK suites instead of skipping their stripe-mock tests.
      - name: Billing (ledger, wallet, payments, webhooks, reports against the service containers, the stripe SDK against stripe-mock)
        env:
          BILLING_REQUIRE_DB: "1"
          STRIPE_MOCK_REQUIRE: "1"
        run: python -m pytest tests/test_billing_signature.py tests/test_billing_proration.py tests/test_billing_provider.py tests/test_billing_stripe_sdk.py tests/test_billing_ledger_db.py tests/test_billing_payments_db.py tests/test_billing_webhooks_db.py tests/test_billing_stripe_sdk_db.py tests/test_billing_reports_db.py tests/test_billing_simulation.py tests/test_billing_demo_cli.py -q -rs
      # The ordering portal (bank debit and invoices through the provider interface against the stand-in and stripe-mock, commissions, the four role access matrix in the API and in row level
      # security generated from its one table, partner fulfilment against a stand-in partner server, and the mutation harness's own tests), named so a skipped suite shows in the log.
      # BILLING_REQUIRE_DB and STRIPE_MOCK_REQUIRE make a service that did not start FAIL here instead of skipping, and -rs prints any skip reason.
      - name: Ordering portal (bank debit, invoices, commissions, access matrix, partner fulfilment)
        env:
          BILLING_REQUIRE_DB: "1"
          STRIPE_MOCK_REQUIRE: "1"
        run: python -m pytest tests/test_billing_ach_db.py tests/test_billing_invoices_db.py tests/test_billing_stripe_sdk_ach.py tests/test_fulfillment_states.py tests/test_fulfillment_client.py tests/test_fulfillment_db.py tests/test_access_matrix.py tests/test_access_matrix_db.py tests/test_access_api_db.py tests/test_portal_guards_db.py tests/test_mutation_check_fulfillment.py -q -rs
      # The e-signature slice (hash chain and name rule, the signing rules against Postgres, the HTTP routes, the 50 seeded worlds, the mutation harness's own tests), named so a
      # skipped database suite shows in the log. ESIGN_REQUIRE_DB makes an unreachable Postgres FAIL here instead of skipping, and -rs prints any skip reason.
      - name: E-signatures (signing request, signature record, hash chained audit log, certificate)
        env:
          ESIGN_REQUIRE_DB: "1"
        run: python -m pytest tests/test_esign_chain.py tests/test_esign_db.py tests/test_esign_api_db.py tests/test_esign_simulation.py tests/test_mutation_check_esign.py -q -rs
      # Google Ads, TikTok, Square, QuickBooks, Shopmonkey and the combined ad spend view, against their stand-in servers, named so a skipped database suite shows in the log.
      # ADS_REQUIRE_DB makes an unreachable Postgres FAIL here instead of skipping, and -rs prints any skip reason.
      - name: Ads and business systems (five connectors against stand-ins, the sync runner, migration 013, the ad spend view and its API call)
        env:
          ADS_REQUIRE_DB: "1"
        run: python -m pytest tests/test_vendor_common.py tests/test_google_ads_connector.py tests/test_tiktok_connector.py tests/test_square_connector.py tests/test_quickbooks_connector.py tests/test_shopmonkey_connector.py tests/test_adspend_view.py tests/test_ads_business_sync_db.py tests/test_gbp_connector.py tests/test_gbp_sync_db.py tests/test_salesforce_connector.py tests/test_lead_match.py tests/test_salesforce_sync_db.py tests/test_harvest_connector.py tests/test_msgraph_connector.py tests/test_harvest_graph_sync_db.py -q -rs
      # The MSP connectors (ConnectWise Manage, Autotask, NinjaOne) against their stand-ins, the records and ledger, the backlog analysis, and the sync runner into Postgres.
      # ADS_REQUIRE_DB makes an unreachable Postgres FAIL here instead of skipping, and -rs prints any skip reason.
      - name: MSP connectors (stand-in servers, records, ledger, backlog analysis, the sync runner and migrations 025 to 027)
        env:
          ADS_REQUIRE_DB: "1"
        run: python -m pytest tests/test_connectwise_connector.py tests/test_autotask_connector.py tests/test_msp_records.py tests/test_msp_sync_db.py -q -rs
      # Inventory planning (the rules and their properties, the Shopify reader against a stand-in, the alert rules, and the database suite as the request role), named so a skipped
      # database suite shows in the log. INVENTORY_REQUIRE_DB makes an unreachable Postgres FAIL here instead of skipping, and -rs prints any skip reason.
      - name: Inventory planning (stockout adjusted velocity, reorder point, classes, alerts raised once, tenant isolation)
        env:
          INVENTORY_REQUIRE_DB: "1"
        run: python -m pytest tests/test_inventory_model.py tests/test_inventory_reader.py tests/test_inventory_alerts.py tests/test_inventory_db.py -q -rs
      # Purchase order tracking (the order rules, the database against them over seeded worlds, the routes, the command line) and the plan workbook, whose formulas are recalculated
      # in LibreOffice and compared with the Python plan. WORKBOOK_REQUIRE_RECALC makes a missing spreadsheet engine FAIL here instead of skipping.
      - name: Install LibreOffice for the workbook recalculation check
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Purchase orders and the plan workbook (order rules, routes, command line, recalculated formulas)
        env:
          INVENTORY_REQUIRE_DB: "1"
          WORKBOOK_REQUIRE_RECALC: "1"
        run: python -m pytest tests/test_inventory_orders_model.py tests/test_inventory_orders_db.py tests/test_inventory_orders_api.py tests/test_inventory_orders_cli.py tests/test_inventory_workbook.py -q -rs
      # The runner's own pg_dump is older than the server, which pg_dump refuses, so the real backup, restore and tamper run goes through the service container's tools.
      - name: Backup and restore proof against the service container
        run: |
          CID=$(docker ps --filter ancestor=pgvector/pgvector:0.8.7-pg17 --format '{{.ID}}' | head -n 1)
          PG_CMD_PREFIX="docker exec -i $CID" python -m pytest tests/test_db_backup.py -q -rs
      - name: Caddyfile and systemd units
        run: |
          docker run --rm -v "$PWD/deploy:/etc/caddy:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/deploy:/deploy:ro" debian:bookworm-slim sh /deploy/verify_units.sh
      - run: python tests/mutation_check.py --check-targets
      - run: python tests/mutation_check_esign.py --check-targets
      - run: python tests/mutation_check_salesforce.py --check-targets
      - run: python tests/mutation_check_harvest_graph.py --check-targets
      - run: python tests/mutation_check_msp.py --check-targets
      - run: python tests/mutation_check_inventory.py --check-targets

  # The web dashboard's own tests: strict TypeScript, ESLint with no explicit any, the Kysely layer against Postgres with row level security,
  # the figure guard, the three export formats read back, the presigned upload against a stand-in S3, the browser test on the built dashboard,
  # and the mutation script. WEB_REQUIRE_DB and WEB_REQUIRE_S3 make a missing Postgres or stand-in FAIL here instead of skipping.
  web:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      WEB_REQUIRE_DB: "1"
      WEB_REQUIRE_S3: "1"
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: analytics
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/lint/package-lock.json
      - name: S3 stand-in (SeaweedFS, checks AWS signature v4)
        run: docker compose --profile s3 up -d --wait s3
      - name: Install
        working-directory: web
        run: |
          npm ci
          npm run lint:install
      - name: Typecheck, lint, and the lint gate's own tests
        working-directory: web
        run: |
          npm run typecheck
          npm run lint
          npm run lint:test
      - name: Unit and database tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Browser test on the built dashboard
        working-directory: web
        env:
          E2E_BROWSERS: chromium      # the three engine run is a local command (README); CI installs and runs Chromium only, to keep the minutes small
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Mutation check, every guard broken one at a time
        working-directory: web
        run: node scripts/mutation_check.mjs
