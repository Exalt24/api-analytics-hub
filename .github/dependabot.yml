version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # pyspark and delta-spark move as one measured pair (the delta-spark 4.3.1 wheel asks for pyspark<=4.1.1, so any bot bump of pyspark cannot install); bump by hand and re-run the lakehouse proof
      - dependency-name: "pyspark"
        update-types: ["version-update:semver-minor", "version-update:semver-major", "version-update:semver-patch"]
      - dependency-name: "delta-spark"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
