services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    # 5433 on purpose: 5432 is already taken by other local stacks on this
    # machine, and two Postgres containers fighting over a port fails in a way
    # that looks like a bad password.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A stand-in S3 for the web tests of the presigned upload helper (web/tests/s3.test.ts). SeaweedFS verifies AWS signature v4
  # (headers and presigned URLs) against the one fake identity in web/tests/s3/seaweedfs-s3.json. It is not AWS.
  # Not started by a plain `docker compose up`; run `docker compose --profile s3 up -d --wait s3`.
  s3:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -master.volumeSizeLimitMB=64 -volume.max=0 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./web/tests/s3/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -S --spider -q http://127.0.0.1:8333/ 2>&1 | grep -q '403'"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Backing services for the job pipeline (app/jobs, docs/job-pipeline.md). Not started by a plain `docker compose up`;
  # run `docker compose --profile jobs up -d --wait`. Ports are off the defaults on purpose, other local stacks use those.
  redis:
    profiles: ["jobs"]
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    profiles: ["jobs"]
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6343:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    profiles: ["jobs"]
    image: rabbitmq:3.13-alpine
    ports:
      - "127.0.0.1:5683:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
